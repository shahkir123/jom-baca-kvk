    <section id="stories" class="screen">
      <div class="heading button-container">
        <h2>Cerita KVK</h2>
        <button class="back" onclick="go('home')">⌂</button>
      </div>
      <div class="card">
        <div id="storyLevelArea"></div>
        <div id="storyContent" style="display:none">
        <div id="storyEmoji" class="illustration">🚌</div>
        <h2 id="storyTitle">Bas Ali</h2>
        <div id="storyText" class="story-text"></div>

        <div class="navrow">
          <button class="secondary" onclick="changeStory(-1)">⬅</button>
          <span id="storyCount" class="pill">1/50</span>
          <button class="primary" onclick="changeStory(1)">➡</button>
        </div>
        <button class="secondary" onclick="chooseStoryLevel()">← Tukar Tahap</button>
        </div>
      </div>
    </section>
    <section id="quiz" class="screen">
      <div class="heading button-container">
        <h2>Kuiz KVK 🎮</h2>

      </div>
      <div class="card quiz-card">
        <div id="quizLevelArea"></div>
        <div id="quizContent" style="display:none">
        <p class="prompt" id="quizPrompt">Apakah ini?</p>
        <div id="quizVisual" class="quiz-img">🚌</div>
        <div id="quizArea"></div>
        <div id="feedback" class="feedback"></div><button class="secondary" onclick="newQuiz()">Soalan baharu ↻</button>
        <button class="secondary" onclick="chooseQuizLevel()">← Tukar Tahap</button>
        </div>
      </div>
    </section>

      <div class="card teacher">
        <h3>Ringkasan pembelajaran</h3>
        <p id="parentSummary"></p>
        <ul>
          <li>Perkataan selesai: <b id="pWords"></b></li>
          <li>Skor kuiz: <b id="pScore"></b></li>
          <li>Cerita selesai: <b id="pStories"></b></li>
          <li>Perkataan perlu latihan: <span id="pWrong" class="wrong"></span></li>
        </ul><button class="secondary" onclick="resetProgress()">Reset Progress</button>
